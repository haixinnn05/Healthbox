<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DoseGuard: Ticket Wallet</title><style>*{box-sizing:border-box;margin:0}html,body{width:1440px;height:900px;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif}.bar{height:72px;display:flex;align-items:center;padding:0 40px;gap:24px}.brand{font-weight:700;font-size:22px}.nav{display:flex;gap:6px;margin-left:24px}.nav a{padding:10px 18px;border-radius:999px;font-weight:700;font-size:17px}.nav a.on{background:#fff}.sp{flex:1}.stop{color:#fff;font-weight:700;padding:12px 22px;border-radius:12px;margin-left:28px}
body{background:#f6f9fc;color:#13315c}.bar{background:#e1eef9}.stop{background:#cf2e2e}
main{padding:44px 96px}h1{font-size:38px}.ticket{margin-top:30px;display:grid;grid-template-columns:1.4fr repeat(3,1fr);max-width:1180px;background:#fff;border:2px solid #13315c;border-radius:14px;overflow:hidden}

.cur{background:#fff5f4}.cur .stamp{border-color:#cf2e2e;color:#cf2e2e}
.go{display:inline-block;margin-top:22px;background:#13315c;color:#fff;font-weight:700;font-size:22px;padding:18px 34px;border-radius:12px}
</style></head><body><div class="bar"><div class="brand">DoseGuard</div><nav class="nav"><a class="on">Today</a><a>Dose steps</a><a>Ask</a></nav><div class="sp"></div><span class="stop">STOP</span></div>
