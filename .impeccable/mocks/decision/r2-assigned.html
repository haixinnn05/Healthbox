<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DoseGuard: Fridge Reminder Card</title><style>*{box-sizing:border-box;margin:0}html,body{width:1440px;height:900px;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif}.bar{height:72px;display:flex;align-items:center;padding:0 40px;gap:24px}.brand{font-weight:700;font-size:22px}.nav{display:flex;gap:6px;margin-left:24px}.nav a{padding:10px 18px;border-radius:999px;font-weight:700;font-size:17px}.nav a.on{background:#fff}.sp{flex:1}.stop{color:#fff;font-weight:700;padding:12px 22px;border-radius:12px;margin-left:28px}
body{background:#f7fafd;color:#16324f}.bar{background:#e3f0fb}.stop{background:#c62f2b}
main{padding:44px 96px}h1{font-size:40px}.date{font-size:20px;color:#3d5a75;margin-top:6px}
.card{margin-top:30px;background:#fff;border:2px solid #9cc8ea;border-radius:16px;padding:10px 0;max-width:980px}
.row{display:grid;grid-template-columns:150px 56px 1fr 260px;align-items:center;padding:20px 32px;font-size:21px}
.row+.row{border-top:1.5px solid #e3f0fb}.box{width:34px;height:34px;border:3px solid #9cc8ea;border-radius:8px}
.tick{background:#16324f;border-color:#16324f;color:#fff;display:grid;place-items:center;font-weight:700}
.due{background:#fff6f5}.due .box{border-color:#c62f2b;border-width:4px}.due b{color:#c62f2b}
.go{background:#16324f;color:#fff;font-weight:700;padding:16px 26px;border-radius:12px;text-align:center}.muted{color:#55708a}
</style></head><body><div class="bar"><div class="brand">DoseGuard</div><nav class="nav"><a class="on">Today</a><a>Dose steps</a><a>Ask</a></nav><div class="sp"></div><span>Caregiver</span><span class="stop">STOP</span></div>
<main><h1>Good afternoon, Jackson</h1><p class="date">Saturday, November 7</p><div class="card">
<div class="row"><b>8:00 AM</b><span class="box tick">&#10003;</span><span>Blue token, 1</span><span class="muted">Taken at 8:04 AM</span></div>
<div class="row due"><b>1:20 PM</b><span class="box"></span><span><b>Blue token, 1</b> &nbsp;due now</span><span class="go">Get my dose</span></div>
<div class="row"><b>6:00 PM</b><span class="box"></span><span>Orange token, 1</span><span class="muted">Later</span></div>
<div class="row"><b>10:00 PM</b><span class="box"></span><span>Blue token, 1</span><span class="muted">Later</span></div>
</div></main></body></html>
